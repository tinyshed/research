[package]
name = "channels-locks-bench"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
tokio = { version = "=1.53.2", features = ["rt-multi-thread", "sync", "time", "macros"] }
rusqlite = { version = "=0.40.2", features = ["bundled", "modern_sqlite", "hooks"] }
serde_json = "=1.0.151"
libc = "=0.2.190"

[profile.release]
debug = 1

