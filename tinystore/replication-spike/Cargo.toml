[package]
name = "tinystore-replication-spike"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
tinystore = { path = "source/crates/tinystore" }
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }
sha2 = { version = "0.11.0", default-features = false }
zstd = { version = "0.14.2", default-features = false }
tempfile = "3.27"
serde_json = "1.0.151"

[lints.rust]
unsafe_code = "deny"
unreachable_pub = "warn"

[lints.clippy]
all = "warn"
