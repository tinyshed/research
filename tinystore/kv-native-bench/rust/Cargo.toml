[package]
name = "tinystore-kv-native-bench"
version = "0.1.0"
edition = "2024"
publish = false

[features]
telemetry = []

[dependencies]
rusqlite = { version = "=0.40.1", default-features = false, features = ["cache", "limits", "modern_sqlite"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
base64 = "=0.22.1"
