[package]
name = "pingmon-bench"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
tinystore = { path = "../source/crates/tinystore", default-features = false, features = ["metrics"] }
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }

[[bin]]
name = "division"
path = "src/division.rs"

[[bin]]
name = "pingmon-bench"
path = "src/main.rs"

[profile.release]
debug = 1

[[bin]]
name = "aggregate"
path = "src/aggregate.rs"
