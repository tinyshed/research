[package]
name = "channels-wire-lab"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
tinystore = { git = "https://github.com/tinyshed/tinystore.git", rev = "76b844cdc8c3410e746a5d5dc3e9aafec83c9962", default-features = false, features = ["kv", "wire"] }
tokio = { version = "=1.53.2", features = ["sync", "rt-multi-thread", "macros", "net", "io-util", "time"] }
serde_json = "=1.0.151"
libc = "=0.2.190"

[profile.release]
debug = 1
