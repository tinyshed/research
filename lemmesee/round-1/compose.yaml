# Round 1's fixture servers: local only, bound to 127.0.0.1, their passwords
# fixtures' own. Images are pinned by digest; the versions are what the
# digests held on 27 October 2026.
name: lemmesee-round-1

services:
  postgres:
    # PostgreSQL 18.6
    image: postgres:18@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
    environment:
      POSTGRES_PASSWORD: lemmesee-admin
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres:/var/lib/postgresql

  mysql:
    # MySQL 8.4.13
    image: mysql:8.4@sha256:76f0358884cb92d9a086d24e5671c38048d3fef40f2588703d73eb55392d6b69
    environment:
      MYSQL_ROOT_PASSWORD: lemmesee-admin
    command:
      - --performance-schema-consumer-events-statements-history-long=ON
    ports:
      - "127.0.0.1:33306:3306"
    volumes:
      - mysql:/var/lib/mysql

volumes:
  postgres:
  mysql:
