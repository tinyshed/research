[package]
name = "probe"
version = "0.1.0"
edition = "2024"

[dependencies]
futures-util = "0.3"
mysql_async = { version = "0.37", default-features = false, features = ["minimal-rust"] }
sqlx-core = { version = "0.9", default-features = false, features = ["_rt-tokio", "_tls-none"] }
sqlx-mysql = { version = "0.9", default-features = false }
tokio = { version = "1", features = ["rt", "macros", "time", "net"] }
