[package]
name = "rssprobe"
version = "0.0.0"
edition = "2024"
publish = false

[features]
bare = ["dep:axum"]
hub = ["dep:axum", "axum/ws", "dep:tinystore", "tinystore/sql", "tinystore/kv", "tinystore/metrics", "tinystore/records", "tinystore/jobs", "dep:tracing-subscriber"]
qjs = ["dep:rquickjs"]
agent = ["dep:tokio-tungstenite", "dep:futures-util", "dep:tokio-postgres", "dep:mysql_async", "dep:rquickjs"]
buffer = ["agent", "dep:tinystore", "tinystore/metrics"]
load = []
# each replaces malloc for the whole process, the C in sqlite and quickjs included
mimalloc = ["dep:mimalloc", "dep:libmimalloc-sys"]
jemalloc = ["dep:tikv-jemallocator", "dep:tikv-jemalloc-sys"]

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
axum = { version = "0.8", optional = true }
tinystore = { version = "=0.1.1", default-features = false, features = ["async"], optional = true }
tracing-subscriber = { version = "0.3", features = ["registry"], optional = true }
rquickjs = { version = "0.14", optional = true }
tokio-tungstenite = { version = "0.30", optional = true }
futures-util = { version = "0.3", optional = true }
tokio-postgres = { version = "0.7", optional = true }
mysql_async = { version = "0.37", default-features = false, features = ["minimal"], optional = true }
mimalloc = { version = "0.1", features = ["override"], optional = true }
libmimalloc-sys = { version = "0.1", features = ["extended"], optional = true }
tikv-jemallocator = { version = "0.7", features = ["unprefixed_malloc_on_supported_platforms"], optional = true }
tikv-jemalloc-sys = { version = "0.7", optional = true }

[[bin]]
name = "bare"
path = "src/bare.rs"
required-features = ["bare"]

[[bin]]
name = "hub"
path = "src/hub.rs"
required-features = ["hub"]

[[bin]]
name = "qjs"
path = "src/qjs.rs"
required-features = ["qjs"]

[[bin]]
name = "agent"
path = "src/agent.rs"
required-features = ["agent"]

[[bin]]
name = "agent-buffer"
path = "src/agent.rs"
required-features = ["buffer"]

[[bin]]
name = "load"
path = "src/load.rs"
required-features = ["load"]

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
