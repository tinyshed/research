[package]
name = "config-weight"
version = "0.0.0"
edition = "2024"
publish = false

# what reading a program's settings costs a binary: typos alone, then config, which needs no store at run time
[features]
config = ["tinystore/config", "dep:serde"]

[dependencies]
tinystore = { version = "=0.5.1", default-features = false, features = ["typos"] }
serde = { version = "1", features = ["derive"], optional = true }

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
