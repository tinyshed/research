[package]
name = "openapi-probe"
version = "0.0.0"
edition = "2024"
publish = false

# three ways to serve the same three routes: no schema, utoipa, aide; each binary needs its feature
[features]
utoipa = ["dep:utoipa", "dep:utoipa-axum"]
aide = ["dep:aide", "dep:schemars"]

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["json", "tokio", "http1"] }
tokio = { version = "1.48", default-features = false, features = ["rt", "net", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
utoipa = { version = "6.0.0", optional = true }
utoipa-axum = { version = "0.3.0", optional = true }
aide = { version = "0.15.1", features = ["axum", "axum-json"], optional = true }
schemars = { version = "0.9", optional = true }

[[bin]]
name = "plain"

[[bin]]
name = "with_utoipa"
required-features = ["utoipa"]

[[bin]]
name = "with_aide"
required-features = ["aide"]

[profile.release]
lto = "fat"
codegen-units = 1
strip = true

[[bin]]
name = "with_utoipa_offline"
required-features = ["utoipa"]
